name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for security vulnerabilities. Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic reproduction when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, deployment mode, operating system, browser/client, database, and other relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, personal data, private keys, and other secrets before posting.
      render: shell
